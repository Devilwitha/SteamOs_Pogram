; LilyGo T-Display-S3 - Statusdisplay fuer CPU-/GPU-Auslastung + Temperatur,
; empfangen ueber WLAN von SteamOS (siehe ../steamOs/stats_monitor.py).
;
; Arduino/PlatformIO statt MicroPython (wie Pico/Led_Pico), weil das Display
; des T-Display-S3 ueber einen parallelen 8-Bit-Bus (nicht SPI) angesteuert
; wird - dafuer gibt es in Standard-MicroPython keinen brauchbaren Treiber,
; TFT_eSPI unterstuetzt das dagegen nativ und ist der von LilyGo selbst
; empfohlene Weg fuer dieses Board (siehe README.md).

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17

; TFT_eSPI-Konfiguration direkt per build_flags statt durch Editieren von
; User_Setup.h in der (von PlatformIO automatisch heruntergeladenen)
; Bibliothek - so bleibt sie bei einem lib-Update erhalten. Pinbelegung
; entspricht LilyGos offiziellem pin_config.h fuer den T-Display-S3.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
