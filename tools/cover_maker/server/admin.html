<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Store Admin</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080b10;
  --panel:#11151d;
  --panel2:#161c27;
  --border:#232c3d;
  --cyan:#00e5ff;
  --cyan-dim:#0891a8;
  --magenta:#ff2e97;
  --green:#39ff8c;
  --amber:#ffb238;
  --red:#ff4d6d;
  --text:#e8edf5;
  --dim:#7686a0;
  --input-bg:#0c1017;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  font-family:"Segoe UI",Roboto,-apple-system,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 12% -10%,rgba(0,229,255,.12),transparent 40%),
    radial-gradient(circle at 90% 110%,rgba(255,46,151,.10),transparent 40%),
    repeating-linear-gradient(rgba(255,255,255,.025) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 26px),
    var(--bg);
  padding:28px 20px 60px;
}
.hud-top{
  max-width:1300px;margin:0 auto 22px;
  text-align:center;
  font-size:.72rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  color:var(--cyan-dim);
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
}
.hud-top span{color:var(--cyan)}
.wrap{max-width:1300px;margin:0 auto}
.navbar{display:flex;gap:10px;justify-content:center;margin:0 0 24px}
.navlink{
  font:inherit;font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 20px;color:var(--dim);border:1px solid var(--border);text-decoration:none;
  background:var(--panel2);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  transition:color .12s ease,border-color .12s ease;
}
.navlink:hover{color:var(--text);border-color:var(--cyan-dim)}
.navlink.active{
  color:#04141a;border-color:var(--cyan);
  background:linear-gradient(180deg,var(--cyan),var(--cyan-dim));
  box-shadow:0 0 12px rgba(0,229,255,.35);
}
h1,h2{font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0}
h1{
  font-size:1.35rem;color:var(--text);
  display:flex;align-items:center;gap:10px;
  padding-left:12px;border-left:4px solid var(--cyan);
  margin-bottom:20px;
}
h2{
  font-size:.8rem;color:var(--cyan);
  padding-left:10px;border-left:3px solid var(--magenta);
  margin:0 0 14px;
}
.panel{
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--border);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  box-shadow:0 0 0 1px rgba(0,229,255,.04),0 8px 24px rgba(0,0,0,.35);
  overflow:hidden;
  padding:16px 18px;
}
.section{margin-bottom:22px}
.field{display:flex;flex-direction:column;gap:4px}
label{font-size:.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=search],input[type=password]{
  font:inherit;padding:9px 12px;border-radius:4px;border:1px solid var(--border);
  background:var(--input-bg);color:var(--text);width:100%;
}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.15)}
.inline-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0}
button, .btn{
  font:inherit;font-weight:700;font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;
  padding:9px 16px;cursor:pointer;color:#04141a;border:1px solid var(--cyan);
  background:linear-gradient(180deg,var(--cyan),var(--cyan-dim));
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  box-shadow:0 0 12px rgba(0,229,255,.35);
  text-decoration:none;display:inline-block;
  transition:transform .12s ease,box-shadow .12s ease;
}
button:hover, .btn:hover{transform:translateY(-1px);box-shadow:0 0 18px rgba(0,229,255,.55)}
.btn.secondary{
  color:#210014;border-color:var(--magenta);
  background:linear-gradient(180deg,var(--magenta),#a8125f);
  box-shadow:0 0 12px rgba(255,46,151,.35);
}
.btn.secondary:hover{box-shadow:0 0 18px rgba(255,46,151,.55)}
.count-badge{color:var(--dim);font-size:.78em;text-transform:uppercase;letter-spacing:.06em;margin-left:auto;align-self:center}
.message{
  padding:12px 16px;margin-bottom:18px;font-size:.9rem;font-weight:600;
  background:rgba(255,255,255,.02);border-left:4px solid;
}
.success{border-color:var(--green);color:var(--green)}
.error{border-color:var(--red);color:var(--red)}
.hint{color:var(--dim);font-size:.82em;line-height:1.6}
.linked{color:var(--green);font-weight:600}
.unlinked{color:var(--amber);font-weight:600}
.missing{color:var(--red);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:10px 12px;text-align:left;vertical-align:top}
th{
  background:rgba(0,229,255,.06);color:var(--cyan);
  font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
td{border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(0,229,255,.035)}
.uid{color:var(--cyan-dim);font-size:.85em;font-family:Consolas,ui-monospace,monospace}
.dim{color:var(--dim);font-size:.85em}
.admin-thumb{width:64px;height:auto;border-radius:4px;border:1px solid var(--border);display:block}
.admin-edit-form{display:flex;flex-direction:column;gap:5px;min-width:220px}
.admin-edit-form label{font-size:.6rem;margin-bottom:-3px}
.admin-edit-form input{padding:6px 9px;font-size:.78rem}
.admin-edit-form button{align-self:flex-end;padding:6px 12px;font-size:.64rem;margin-top:2px}
.empty-store{color:var(--dim);font-style:italic;padding:20px;text-align:center}
</style>
</head>
<body>
<div class="hud-top"><span>&#9670;</span> Steam &middot; Cover Store Admin <span>&#9670;</span></div>
<div class="wrap">
<div class="navbar">
  <a class="navlink" href="/">&#9670; Store</a>
  <a class="navlink" href="/maker">&#9670; Cover Maker</a>
</div>
<h1>Admin</h1>
__MESSAGE__
__BODY__
</div>
</body>
</html>
