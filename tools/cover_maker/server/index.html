<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Store</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080b10;
  --panel:#11151d;
  --panel2:#161c27;
  --border:#232c3d;
  --cyan:#00e5ff;
  --cyan-dim:#0891a8;
  --magenta:#ff2e97;
  --green:#39ff8c;
  --amber:#ffb238;
  --red:#ff4d6d;
  --text:#e8edf5;
  --dim:#7686a0;
  --input-bg:#0c1017;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  font-family:"Segoe UI",Roboto,-apple-system,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 12% -10%,rgba(0,229,255,.12),transparent 40%),
    radial-gradient(circle at 90% 110%,rgba(255,46,151,.10),transparent 40%),
    repeating-linear-gradient(rgba(255,255,255,.025) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 26px),
    var(--bg);
  padding:28px 20px 60px;
}
.hud-top{
  max-width:1200px;margin:0 auto 22px;
  text-align:center;
  font-size:.72rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  color:var(--cyan-dim);
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
}
.hud-top span{color:var(--cyan)}
.wrap{max-width:1200px;margin:0 auto}
.navbar{display:flex;gap:10px;justify-content:center;margin:0 0 24px}
.navlink{
  font:inherit;font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 20px;color:var(--dim);border:1px solid var(--border);text-decoration:none;
  background:var(--panel2);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  transition:color .12s ease,border-color .12s ease;
}
.navlink:hover{color:var(--text);border-color:var(--cyan-dim)}
.navlink.active{
  color:#04141a;border-color:var(--cyan);
  background:linear-gradient(180deg,var(--cyan),var(--cyan-dim));
  box-shadow:0 0 12px rgba(0,229,255,.35);
}
h1,h2{font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0}
h1{
  font-size:1.35rem;color:var(--text);
  display:flex;align-items:center;gap:10px;
  padding-left:12px;border-left:4px solid var(--cyan);
  margin-bottom:20px;
}
h2{
  font-size:.82rem;color:var(--cyan);
  padding-left:10px;border-left:3px solid var(--magenta);
  margin:36px 0 14px;
}
.panel{
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--border);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  box-shadow:0 0 0 1px rgba(0,229,255,.04),0 8px 24px rgba(0,0,0,.35);
  overflow:hidden;
  padding:16px 18px;
}
.toolbar{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-bottom:20px}
.toolbar .panel{flex:1 1 320px}
form.inline-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0}
label{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=search]{
  font:inherit;padding:9px 12px;border-radius:4px;border:1px solid var(--border);
  background:var(--input-bg);color:var(--text);flex:1 1 180px;min-width:140px;
}
input[type=file]{font:inherit;font-size:.8rem;color:var(--dim);flex:1 1 160px}
select{
  font:inherit;padding:8px 10px;border-radius:4px;border:1px solid var(--border);
  background:var(--input-bg);color:var(--text);flex:1 1 200px;
}
input:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.15)}
button, .btn{
  font:inherit;font-weight:700;font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;
  padding:9px 16px;cursor:pointer;color:#04141a;border:1px solid var(--cyan);
  background:linear-gradient(180deg,var(--cyan),var(--cyan-dim));
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  box-shadow:0 0 12px rgba(0,229,255,.35);
  text-decoration:none;display:inline-block;
  transition:transform .12s ease,box-shadow .12s ease;
}
button:hover, .btn:hover{transform:translateY(-1px);box-shadow:0 0 18px rgba(0,229,255,.55)}
.btn.secondary{
  color:#210014;border-color:var(--magenta);
  background:linear-gradient(180deg,var(--magenta),#a8125f);
  box-shadow:0 0 12px rgba(255,46,151,.35);
}
.btn.secondary:hover{box-shadow:0 0 18px rgba(255,46,151,.55)}
.count-badge{color:var(--dim);font-size:.78em;text-transform:uppercase;letter-spacing:.06em;margin-left:auto;align-self:center}
.message{
  padding:12px 16px;margin-bottom:18px;font-size:.9rem;font-weight:600;
  background:rgba(255,255,255,.02);border-left:4px solid;
}
.success{border-color:var(--green);color:var(--green)}
.error{border-color:var(--red);color:var(--red)}
.store-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:18px;
}
.card{
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--border);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  box-shadow:0 0 0 1px rgba(0,229,255,.04),0 8px 20px rgba(0,0,0,.35);
  overflow:hidden;
  display:flex;flex-direction:column;
  transition:transform .12s ease,box-shadow .12s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(0,229,255,.15),0 10px 26px rgba(0,0,0,.45)}
.thumb-frame{
  display:block;background:var(--input-bg);
  aspect-ratio:16/10;overflow:hidden;
  border-bottom:1px solid var(--border);
}
.thumb-frame img{width:100%;height:100%;object-fit:contain;display:block}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.card-title{font-size:.86rem;font-weight:600}
.card-line{font-size:.8rem}
.card-label{color:var(--dim);text-transform:uppercase;font-size:.68rem;letter-spacing:.05em;margin-right:4px}
.card-meta{font-size:.72rem;color:var(--dim)}
.card-meta.dim{opacity:.8}
.linked{color:var(--green);font-weight:600}
.unlinked{color:var(--amber);font-weight:600}
.missing{color:var(--red);font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
.card-actions{display:flex;gap:6px;margin-top:6px}
.card-actions .btn{padding:6px 10px;font-size:.68rem}
.empty-store{color:var(--dim);font-style:italic;padding:30px 0;text-align:center}
.admin-link{
  position:fixed;left:6px;bottom:4px;font-size:9px;letter-spacing:.04em;
  color:var(--border);opacity:.5;text-decoration:none;z-index:50;
}
.admin-link:hover{opacity:1;color:var(--dim)}
</style>
</head>
<body>
<div class="hud-top"><span>&#9670;</span> Steam &middot; Cover Store <span>&#9670;</span></div>
<div class="wrap">
<div class="navbar">
  <a class="navlink active" href="/">&#9670; Store</a>
  <a class="navlink" href="/maker">&#9670; Cover Maker</a>
</div>
<h1>Cover Store</h1>
__UPLOAD_MESSAGE__

<div class="toolbar">
  <div class="panel">
    <h2 style="margin-top:0">Suche</h2>
    <form method="GET" action="/" class="inline-row">
      <input type="search" name="q" value="__QUERY__" placeholder="Spiel, Theme oder Ersteller suchen...">
      <button type="submit">Suchen</button>
      <span class="count-badge">__COUNT__ Cover</span>
    </form>
  </div>
  <div class="panel">
    <h2 style="margin-top:0">Cover hochladen</h2>
    <form method="POST" action="/upload" enctype="multipart/form-data" class="inline-row">
      <input type="file" name="cover_file" accept=".png,.jpg,.jpeg,.webp,.bmp" required>
      <input type="text" name="theme_name" placeholder="Theme-Name" required>
      <input type="text" name="author_name" placeholder="Ersteller" required>
      <input type="text" name="game_name" placeholder="Spielname (optional)">
      <button type="submit">Hochladen</button>
    </form>
  </div>
</div>

<div class="store-grid">
__CARDS__
</div>
</div>
<a class="admin-link" href="/admin">admin</a>
</body>
</html>
